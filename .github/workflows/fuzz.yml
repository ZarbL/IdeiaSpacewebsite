name: Fuzz

on:
  pull_request:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  fuzz:
    name: Fuzz (contato, helpers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run fuzz suite
        env:
          FUZZ_RUNS: ${{ github.event_name == 'schedule' && '3000' || '200' }}
        run: npm run test:fuzz

  open-issue-on-failure:
    needs: fuzz
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'fuzz', state: 'open',
            });
            if (data.some(i => i.title.startsWith('Fuzz noturno falhou'))) return;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Fuzz noturno falhou — ${new Date().toISOString().slice(0,10)}`,
              labels: ['fuzz', 'bug'],
              body: `O run agendado de fuzzing achou um contraexemplo.\n\n` +
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
                `Rode \`npm run test:fuzz\` localmente — o fast-check imprime o input mínimo que quebra.`,
            });
